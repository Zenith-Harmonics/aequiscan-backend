[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "aequiscan-backend"
version = "0.1.0"
description = "Cross-planetary analog comparison dashboard API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "xarray>=2024.6",
    "h5netcdf>=1.3",
    "h5py>=3.10",
    "earthaccess>=0.12",
    "pyproj>=3.6",
    "httpx>=0.27",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests requiring live NASA Earthdata credentials and network (deselect with '-m \"not integration\"')",
]
addopts = "-m 'not integration'"
